[project]
name = "vai-backend"
version = "0.1.0"
description = "Local AI long-form YouTube video editor - backend"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = ["."]
testpaths = ["tests"]
# --basetemp keeps every temporary artefact -- transcoded proxies, extracted
# audio, frame dumps -- inside the repository. The default lands them in the
# user's system temp directory, which may be on a drive that cannot take them.
addopts = "-ra --strict-markers --strict-config --basetemp=.pytest-tmp"
markers = [
    "unit: fast isolated tests with no external process or model",
    "integration: tests that cross a component boundary (API, database, ffmpeg)",
    "e2e: full-pipeline tests over a golden project",
    "requires_ffmpeg: needs an ffmpeg binary on PATH",
    "requires_gpu: needs an NVIDIA GPU",
    "requires_models: needs local AI models (Ollama / WhisperX)",
    "slow: transcodes minutes of video; run with -m slow",
]
filterwarnings = ["error::DeprecationWarning:backend.*"]

[tool.coverage.run]
source = ["backend"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "node_modules", "packages/schemas/json"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "PTH", "RUF"]
ignore = [
    # FastAPI dependency injection is function calls in argument defaults.
    "B008",
    # Arabic is a first-class language for this product: instructions, questions
    # and captions are written in it. The "ambiguous unicode" rules flag every
    # Arabic letter and digit as a possible Latin lookalike, which is noise here.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
# Entry-point scripts put the repository on sys.path before importing from it.
"scripts/*" = ["E402"]
