# Narrative construction (SPEC sections 35-39).

narrative:
  # Story mode optimises narrative coherence, not raw moment score (§36).
  story:
    structure:
      - hook
      - context
      - build_up
      - event
      - escalation
      - climax
      - reaction
      - ending
    # A weaker moment may win a slot when it supplies necessary context (§36).
    coherence_weight: 0.55
    score_weight: 0.45
    require_climax: true

  best_moments:
    # Ranked selection with variety enforcement; no story arc imposed.
    ordering: descending_score
    interleave_types: true

  compilation:
    group_by: moment_type
    group_order:
      - epic
      - clutch
      - skill
      - outplay
      - funny
      - fail
    separator_seconds: 0.5

  # Hook engine (§37). The system selects an existing moment; it never invents
  # narration or fabricates footage.
  hook:
    enabled: true
    max_seconds: 25.0
    min_seconds: 5.0
    sources:
      - epic
      - clutch
      - funny
      - surprise
      - outcome_preview
    # A moment used as the hook may be replayed in its chronological position
    # (the cold-open convention). Off by default: the first person to watch a
    # real edit reported the repeat as a defect, and the human has the last
    # word on taste (SPEC 78). When off, the hooked span is trimmed OUT of the
    # body copy rather than the whole moment being dropped -- the setup stays,
    # only the already-shown seconds go.
    allow_replay_in_body: false

  # Pacing (§38).
  pacing:
    min_clip_seconds: 2.0
    max_clip_seconds: 120.0
    target_clips_per_minute: 2.2
    max_consecutive_same_type: 2
    max_consecutive_low_intensity_seconds: 45.0
    intensity_curve: rising

  # Duration optimizer (§39). This is a constrained optimisation, not a sort:
  # pick the subset of moments closest to the target while maximising
  # entertainment, narrative and variety, minus repetition and dead time.
  optimizer:
    strategy: weighted_knapsack
    objective_weights:
      entertainment: 1.00
      narrative: 0.90
      variety: 0.70
    objective_penalties:
      repetition: 0.80
      dead_time: 0.70
    max_iterations: 500
    # When the best subset still misses the band, trimming context is tried
    # before dropping a moment entirely.
    allow_context_trim: true
    # And the other direction: every moment already in, still short of the
    # target, so the clips take more of the footage that leads into and out of
    # them. Never into another clip and never past the recording -- when that
    # is not enough, a short honest video beats a padded one.
    allow_context_growth: true
    max_context_growth_ratio: 0.4
    max_context_trim_ratio: 0.5

  # The last pass over the final cut points (backend/narrative/refinement.py).
  # §29 snaps boundaries and §39's duration trim re-cuts them blind; this runs
  # after both, at word level, and is what keeps cuts out of the middle of a
  # sentence. Measured on a real project it took 5 mid-word cuts to 3 (the
  # remaining ones sit in speech with no pause within reach, and say so in the
  # plan notes), merged 2 needless joins, and healed a 3.5s overlap.
  # Clip boundaries against what the screen was showing. The first fully
  # autonomous video opened on the record-button click and ran one 398-second
  # slab; openings now advance past menus/loading/desktop and the first
  # seconds of every recording, and slabs split at stored scene seams.
  screen_guard:
    enabled: true
    recording_start_guard_seconds: 4.0
    dead_state_pad_seconds: 0.4
    max_clip_seconds: 75.0
    min_piece_seconds: 8.0

  refinement:
    enabled: true
    snap_window_seconds: 2.5    # how far a cut may move to reach a pause
    stretch_window_seconds: 4.0 # further, in the direction that only adds context
    min_pause_seconds: 0.35     # the shortest inter-word gap worth cutting in
    core_give_seconds: 1.0      # slack into the core span; event edges carry detector slop
    # Where inside the pause. 0.1 = cut just after the outgoing words, so the
    # incoming clip inherits ~90% of the gap as lead-in and speech resumes
    # almost immediately (Leake et al., SIGGRAPH 2017). 0.5 is the midpoint.
    pause_split: 0.1
    # Tail kept after the last word. Cannot drop below 0.2: the 0.15 word pad
    # already covers trailing S/P sounds, and a cut inside the pad would read
    # as mid-speech. Values under 0.2 are clamped up.
    min_trailing_seconds: 0.2

  # Film grammar at the joins (§40). A hard cut says "continuous time", and a
  # chronological gaming edit jumps minutes at nearly every join -- the dip to
  # black is the standard "later..." signal. Kept under blackdetect's 0.5s
  # floor so QA never mistakes it for a broken render.
  transitions:
    enabled: true
    # Owner ask 2026-08-28 ("good coherence between shots"): every skipped
    # stretch a viewer could notice announces itself. 45 let sub-minute jumps
    # pose as continuity.
    time_jump_seconds: 20
    dip_seconds: 0.3         # each side of the join

  # The Director (Phase C). Everything above decides which moments and in what
  # order by rule; this asks a model to look at the whole set first and say
  # what the video is about, which of them tell it, and what each one is doing
  # there. Code still cuts, still enforces the band, and still owns the clock:
  # when chronological order is on -- and it is, always, by default -- the
  # Director's choices and roles are kept and its ordering is discarded.
  #
  # Off is a complete product. No model, no server, or an answer that names a
  # moment nobody found: the deterministic order runs and the plan notes say
  # why. The model is unloaded the moment it answers, because the render needs
  # the card next (§54).
  director:
    enabled: true
