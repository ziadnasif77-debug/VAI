# Rendering configuration (SPEC sections 5, 55, 64-70, 75).
#
# FFmpeg is the low-level media layer and the final encoder (§65).
# Remotion composes captions, motion graphics and effects (§66).
# Neither decides which clips are good - the AI layer does (§64).

video:
  default_resolution: 1080
  default_fps: 60
  aspect_ratio: "16:9"
  # "source" keeps the recording's frame rate instead of forcing a value.
  fps_mode: explicit          # explicit | source
  supported_resolutions: [720, 1080]
  supported_fps: [30, 60]

render:
  container: mp4
  video_codec: h264
  audio_codec: aac
  pixel_format: yuv420p
  faststart: true
  gop_seconds: 2.0
  # Tried in order; first available wins. CUDA where present, CPU otherwise (§52).
  encoder_preference:
    - h264_nvenc
    - libx264
  bitrate:
    "1080p60": "16M"
    "1080p30": "12M"
    "720p60": "9M"
    "720p30": "6M"
  max_bitrate_multiplier: 1.35
  nvenc:
    preset: p5
    tune: hq
    rate_control: vbr
    rc_lookahead: 20
  libx264:
    preset: medium
    crf: 19
  # J-cuts and L-cuts: the audio leads (J) or trails (L) the picture at a cut,
  # instead of both switching on the same frame. Only boundaries where speech
  # opens the incoming clip (J) or tails the outgoing one (L) are offset;
  # everything else stays a hard cut. Turned on 2026-08-27 after the live
  # certification render passed QA with it -- the standard join inside a scene
  # is film grammar's default, and the hard cut is the marked case.
  jl_cuts:
    enabled: true
    max_lead_seconds: 0.6
    crossfade_ms: 120
    speech_window_seconds: 1.0

# YouTube preset (§75). Exposed as a single selectable target.
youtube_preset:
  name: "YouTube 1080p60"
  resolution: 1080
  fps: 60
  video_codec: h264
  audio_codec: aac
  audio_bitrate: "384k"
  audio_sample_rate: 48000
  audio_channels: 2

ffmpeg:
  binary: ffmpeg
  ffprobe_binary: ffprobe
  threads: 0
  loglevel: error
  overwrite_output: true
  timeout_seconds: 28800
  # Hardware-accelerated decode for long recordings, when available.
  hwaccel: auto

# Proxy media for UI preview and analysis (§55). The original is used for the
# final render and is never modified (§42).
proxy:
  enabled: true
  resolution: 720
  fps: 30
  # Hardware encode for the analysis proxy. The proxy is watched by detectors,
  # not people, and NVENC measured 3.2x realtime on this machine's final
  # renders -- on a 720p proxy it is far faster still. Falls back to libx264
  # automatically when no working NVENC exists (SPEC 95).
  codec: h264_nvenc
  preset: p4
  crf: 28   # applied as -cq for NVENC codecs, -crf for software ones

  audio_codec: aac
  audio_bitrate: "128k"

# Preview thumbnails for scenes, events, moments and timeline clips (§56).
thumbnails:
  enabled: true
  width: 480
  jpeg_quality: 5
  per_moment: 3
  per_scene: 1

# Remotion renders motion graphics ONLY, as a transparent overlay.
#
# Remotion rasterises every frame through Chromium. That is the right tool for
# captions, lower thirds and intro/outro, and the wrong tool for stitching
# twenty minutes of raw gameplay: FFmpeg does that job with NVENC in a fraction
# of the time. So the render is two passes:
#
#   1. FFmpeg   cut + concat + transitions + speed + audio mix  -> base.mp4
#   2. Remotion captions + graphics on a transparent canvas     -> overlay.webm
#   3. FFmpeg   overlay composite + final encode                -> output.mp4
#
# Remotion still receives a deterministic composition description and performs
# no selection of its own (§64).
remotion:
  enabled: true
  mode: overlay              # overlay | full  ("full" is for experiments only)
  project_dir: remotion
  composition_id: OverlayLayer
  # 0 = size to this machine (cores minus two). The shipped 2 left ten of a
  # 12-thread machine's cores idle through an hour-long overlay pass.
  concurrency: 0
  # The overlay's own frame rate; 0 = match the output. Captions at 30
  # composite invisibly over 60fps gameplay (the overlay filter holds frames
  # by timestamp), and half the frames is half the Chromium pass.
  overlay_fps: 30
  timeout_seconds: 28800
  input_filename: composition.json
  # Alpha-capable intermediate. VP9/WebM keeps the file small; ProRes 4444 is
  # the lossless option when overlay quality matters more than disk.
  overlay_format: webm_vp9_alpha
  overlay_codec_options:
    webm_vp9_alpha:
      codec: libvpx-vp9
      pixel_format: yuva420p
      crf: 24
    prores_4444:
      codec: prores_ks
      pixel_format: yuva444p10le
      profile: 4444
  # Skip the Remotion pass entirely when the timeline has no overlay elements,
  # so a caption-free video never pays the Chromium cost.
  skip_when_no_overlays: true

  # The card is read once before Chromium starts, because nothing else on the
  # machine promises to leave it empty: on 2026-08-15 a model another program
  # left resident held 4.7 GB of 8 with an expiry in the year 2318, and every
  # browser connection timed out 25 slow seconds at a time. Below
  # min_free_vram_mb the overlay renders with a single page; below
  # skip_overlay_below_mb it is not attempted at all and the render ships the
  # plain cut with a note naming what holds the memory (§95). A machine that
  # cannot report its VRAM is left alone. 0 disables either check.
  min_free_vram_mb: 1500
  skip_overlay_below_mb: 500
  # Rough cost of one Chromium page at 1080p, used to cap concurrency on a
  # card that is above the floor but still tight.
  vram_per_page_mb: 250

  # And the same idea one level finer: when the timeline *does* have overlay
  # elements, only the stretches carrying them go through Chromium. The
  # composite puts each stretch back where it belongs. Measured on a real
  # ten-minute edit with three graphics: 18,287 frames rasterised to draw 98.
  #
  # Each stretch is a branch in the composite's filter graph, so gaps shorter
  # than merge_gap are paid for instead of split at, and the narrowest gaps are
  # bought back until the count fits max_overlay_segments. 0 renders the whole
  # layer, which is what this did before.
  max_overlay_segments: 24
  overlay_merge_gap_seconds: 2.0
  # A plan that saves less than this renders whole: a more complex filter graph
  # for a twentieth of the frames is a bad trade.
  min_overlay_saving: 0.15

# Effects live in config/effects.yaml -- the effects engine is its own module.

# Vertical Shorts (9:16) cut from the same analysis. A Short is a tiny edit
# rendered through the same stack as the long video -- an NVENC cut of one
# strong moment, centre-cropped, captions composited at the vertical frame.
# Delivery-gated like everything else: nothing is cut until asked -- and
# auto_after_qa below is the owner asking, once, in configuration.
shorts:
  enabled: true
  # Owner standing instruction (2026-08-28): one or two Reels ready after
  # every render of the main video. A green QA queues the cut by itself.
  auto_after_qa: true
  count: 2
  min_seconds: 15
  max_seconds: 60
  width: 1080
  height: 1920
  # center keeps the action and crops the HUD corners away -- for a Short,
  # a feature.
  anchor: center
  captions: true
