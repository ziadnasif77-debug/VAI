# The Style Bible (V2-P8).
#
# A style already existed here, and it reached exactly one place. The presets
# in `interaction.yaml` set `intent.style`, `effects.yaml: style_profiles`
# says how strongly that style decorates, and `backend/effects/planner.py`
# reads it. Nothing else in the editorial stack knew a style existed -- not
# one cut length, not one audio decision, not one thing the judge values, not
# one defect threshold. Those were module constants in Python, the same for
# every video this machine will ever make.
#
# This file is the body behind the name. It holds taste and only taste:
#
#   * A measurement stays in code. `SILENCE_DB = -40.0` is what silence *is*;
#     moving it here would not let anyone change the channel, it would let
#     them break the reading.
#   * A vocabulary stays in code. Levels, roles, lanes, defect codes and the
#     correction verbs are the language the stages speak, not preferences.
#   * A limit the hardware imposes stays in the file that owns the hardware.
#
# Two rules make this a bible rather than more YAML:
#
#   1. Every style carries a `version`. A change of taste becomes an event you
#      can point at, and every edit records the style and version that made it
#      (table `edit_styles`), so "which videos were cut this way" has an
#      answer that does not depend on anyone's memory.
#   2. Every tunable declares its legal range once, under `limits`. Nobody may
#      set a value outside it -- not a person editing this file, and not the
#      controlled tuning of P10. A fence built before the thing it fences is
#      the only kind worth having.
#
# Nothing here was learned. These numbers were authored, and most of them were
# authored by being copied out of the Python that already held them.

style:
  # The body used by a project that names no style, and by any style whose
  # body is not authored below.
  #
  # `default` rather than `best_moments` so that this file and the effects
  # library give the same answer to the same question: `EffectsConfig.profile`
  # falls back to the `default` profile for a name it does not know, and a
  # bible that fell back to something else would decorate a typo as one style
  # and cut it as another.
  default: default

  # The legal range of every tunable, declared once because a bound is a
  # property of the machine rather than of a taste. A style that violates one
  # refuses to load, naming the key: clamping it silently would turn this file
  # into a suggestion.
  limits:
    pacing.band_scale: { min: 0.5, max: 2.0 }
    pacing.stutter_relief: { min: 1.0, max: 1.6 }
    pacing.stillness_relief: { min: 1.0, max: 1.8 }
    pacing.ending_relief: { min: 1.0, max: 2.5 }
    pacing.on_the_beat_seconds: { min: 0.1, max: 1.0 }
    audio.min_section_seconds: { min: 8.0, max: 60.0 }
    audio.silence_before_payoff: { min: 0.0, max: 2.0 }
    audio.silence_min_strength: { min: 0.3, max: 1.0 }
    judgement.ideal_effects_per_minute: { min: 0.0, max: 8.0 }
    judgement.ideal_speech_share: { min: 0.0, max: 0.9 }
    # (V2-P11) What a style may ask of the *selection*. These reach the
    # optimiser as bounded multipliers on the objective it already has -- never
    # as a taste it has to read -- so the optimiser stays deterministic and a
    # style that asks for something absurd is refused rather than obeyed.
    selection.entertainment: { min: 0.25, max: 3.0 }
    selection.narrative: { min: 0.25, max: 3.0 }
    selection.variety: { min: 0.25, max: 3.0 }
    selection.repetition_penalty: { min: 0.25, max: 3.0 }
    selection.dead_time_penalty: { min: 0.25, max: 3.0 }
    # (V2-P0) What a style may ask of the *shots*. The layer the bible was
    # missing: until these existed a style could say which moments it liked
    # and nothing about how one is cut, so five styles handed a session
    # shorter than the target produced one identical video.
    shots.trim_lead_in: { min: 0.0, max: 0.35 }
    shots.trim_tail: { min: 0.0, max: 0.35 }
    shots.max_drift: { min: 0.0, max: 2.0 }
    shots.dead_time_weight: { min: 0.0, max: 2.0 }
    critique.hook_seconds: { min: 5.0, max: 30.0 }
    critique.effects_per_ten_seconds: { min: 1.0, max: 12.0 }
    critique.fatigue_seconds: { min: 10.0, max: 60.0 }
    critique.repeat_run: { min: 2, max: 6 }

  # Controlled tuning (V2-P10). The only mechanism in this project permitted
  # to change a decision without a person asking, and every number here exists
  # to make that permission small.
  #
  # Off. Enabling it is a deliberate act, and even enabled it refuses to
  # propose anything until the evidence below exists -- which today it does
  # not: this channel has zero measured videos.
  tuning:
    enabled: false

    # A proposal may not exist below this much evidence. Fifteen is not a
    # statistical threshold and does not pretend to be one; it is the point
    # where the owner and this system agreed a comparison is worth looking at.
    minimum_videos: 15

    # And each side of a comparison needs its own sample. Two arms of one
    # video each is not a comparison, it is two anecdotes.
    minimum_per_arm: 5

    # One adjustment may move a value by at most this fraction of its declared
    # range. A tenth of the range means no single decision can swing the
    # channel, and ten of them in a row still cannot leave the fence.
    max_step_fraction: 0.10

    # A key that was moved stays put until this many further videos have been
    # measured with the new value. Without it the mechanism would chase its
    # own last change.
    cooldown_videos: 5

    # The one number a proposal compares. The share of the video a viewer
    # actually watched is the least gameable single measure of an edit --
    # views measure the thumbnail, likes measure the audience's mood.
    metric: averageViewPercentage

  # One entry per style the effects library knows, because a name that
  # decorates and cannot cut is the half-a-style this phase exists to finish.
  #
  # An entry that overrides nothing is not an oversight: it says this style
  # cuts the way the machine has always cut, and the defaults it inherits are
  # the exact constants that were in Python before this file existed. Adopting
  # the bible therefore changes no video until someone edits it, which is the
  # only honest way to introduce a document claiming to describe what already
  # happens.
  bible:
    best_moments:
      version: 1
      description: >-
        The channel as it is cut today: the session's own shape, emphasis
        where the footage earns it, speech left alone.

    cinematic:
      version: 1
      description: >-
        Longer shots, quieter emphasis, silence used deliberately. The effects
        profile of this name already suppresses impact and flash and boosts
        bars and slow motion; this is the rest of that decision.
      selection:
        # Fewer, stronger situations held longer. Narrative over spectacle,
        # and a high tolerance for a quiet stretch that earns the next one --
        # a cinematic edit that punishes dead time is just a fast edit.
        narrative: 1.30
        entertainment: 0.85
        variety: 0.70
        dead_time_penalty: 0.60
      shots:
        # The baseline found this style producing the house edit exactly, in
        # six projects out of nine. Its whole claim is a different pace, and
        # a claim it cannot make when the footage is short enough that
        # everything is selected is not a style -- it is a description.
        #
        # So it asks for the one thing selection cannot give it: where the
        # cuts land. A cinematic cut falls on a boundary the footage already
        # has, never on the second a moment happens to end at. Nothing is
        # trimmed, because the run-up and the tail are exactly what this
        # style is for, and dead time stays unpriced for the same reason the
        # selection tolerates it -- silence here is a decision, not a defect.
        snap_to_seams: true
        max_drift: 2.0
      pacing:
        band_scale: 1.35
        stutter_relief: 1.05
        stillness_relief: 1.5
        ending_relief: 2.0
        on_the_beat_seconds: 0.5
      audio:
        min_section_seconds: 35.0
        silence_before_payoff: 1.4
        silence_min_strength: 0.5
        shelves:
          calm: low
          normal: low
          tension: low
          high: build
          climax: peak
      judgement:
        ideal_effects_per_minute: 1.2
        ideal_speech_share: 0.45
      critique:
        hook_seconds: 20.0
        effects_per_ten_seconds: 2.0
        fatigue_seconds: 40.0
        repeat_run: 4

    gaming_fast:
      version: 1
      description: >-
        The high-energy read: the strongest minutes, cut short, with dead time
        expensive. Entertainment over narrative -- this style is not telling a
        story, it is not letting the viewer look away.
      selection:
        entertainment: 1.45
        narrative: 0.80
        dead_time_penalty: 1.80
        repetition_penalty: 1.30
      shots:
        # Fast is not only "more clips". It is less air around each one: no
        # waiting for the shot to begin, no holding after it is over. The
        # optimiser cannot do this -- it chooses moments, not their edges --
        # which is why this style looked like the house style whenever the
        # footage was short.
        #
        # A stretch that adds no context, anticipation, progression, payoff
        # or reaction is priced here, because in a fast edit it is the one
        # thing the viewer will not forgive.
        trim_lead_in: 0.25
        trim_tail: 0.30
        dead_time_weight: 1.0
        # A fast edit cannot afford a slow start, and it is the one editorial
        # opening decision a chronological edit can still make: the cold-open
        # hook is a flash-forward and the constitution forbids it, but moving
        # where the video *begins* reorders nothing.
        trim_weak_opening: true
        trim_weak_ending: true
        # The other end, for the same reason: a fast edit that keeps rolling
        # after the thing has happened is not a fast edit.
        trim_at_resolution: true
      pacing:
        band_scale: 0.8

    story:
      version: 1
      description: >-
        Told rather than shown off. Unauthored beyond the judge's preference
        for speech, which is what the mode is for.
      judgement:
        ideal_speech_share: 0.5

    funny:
      version: 1
      description: >-
        A joke needs its setup. Variety high because the same gag twice is not
        twice as funny, and dead time cheap because the pause before a
        punchline is the punchline.
      selection:
        variety: 1.60
        repetition_penalty: 1.70
        dead_time_penalty: 0.55
        narrative: 0.90
      shots:
        # A joke lands on its reaction, so the tail is never trimmed here --
        # `ContextPolicy` protects a shot somebody responds to, and this style
        # relies on that protection rather than working around it. What it
        # does trim is the walk-up to the joke, which is the part that kills
        # one.
        trim_lead_in: 0.30
        trim_tail: 0.10
        # Zero, and this is the one number in the file argued *down*.
        #
        # It was 0.8, and it contradicted two things at once: the selection
        # doctrine four lines above, where `dead_time_penalty: 0.55` says a
        # quiet stretch is welcome here, and this style's own description --
        # "dead time cheap because the pause before a punchline is the
        # punchline". A comic pause earns no context, no anticipation, no
        # progression, no payoff and no reaction. That is what makes it a
        # pause, and pricing it removes the beat the joke lands on.
        #
        # Comedy is the one style where dead time is the technique. Nothing
        # else in this file may say that, and this style has to.
        dead_time_weight: 0.0
        # A joke lands on the laugh, and the laugh is in the seconds after the
        # shot. `trim_tail` above is deliberately small for the same reason;
        # this is the other half of it -- the tail is not merely spared, it is
        # held until the response finishes.
        hold_for_response: true
        # Opening on a weak beat is how a funny video stops being one. The
        # ending is left alone: a joke's last laugh is often its quietest
        # shot, and `_ending` protects a reaction but not a wry one.
        trim_weak_opening: true
      pacing:
        # A joke needs room to land. A little longer than the house, and
        # nowhere near cinematic's 1.35: a slow joke is not a funnier one.
        band_scale: 1.10
        # The last shot gets more of it than any other, because a comic ending
        # cut on time is cut early.
        ending_relief: 2.0
      audio:
        # The held breath before the reveal -- the *pause* of setup, pause,
        # reveal, in the one layer that can actually hold it. Twice the
        # house's 0.8s, and a lower floor so more beats qualify, because a
        # comic beat is rarely the session's loudest moment.
        silence_before_payoff: 1.6
        silence_min_strength: 0.40
      captions:
        # The lit word is where a punchline lands, so it lands bigger. 0.056
        # against the house's 0.048 -- a sixth larger, which reads as
        # deliberate at 1080p and still clears the safe area at two lines.
        font_size_ratio: 0.056
        # And lit in something other than the house gold. The highlight is not
        # decoration here; it is the beat the joke resolves on, and a colour
        # that says "this word" rather than "there are words" is the whole
        # difference between a subtitle and a punchline.
        highlight_color: "#FF4FA3"
        # `animated` and `word_highlighting` are deliberately unset. The house
        # already fades a caption in and lights the spoken word, and this style
        # wants both -- so it says nothing and receives the house's own
        # configuration rather than a copy that happens to agree with it.
      judgement:
        # Comedy is talked over. The house expects speech across 0.35 of an
        # edit and marks a talkier one down; here the talking is the joke.
        ideal_speech_share: 0.55
      critique:
        # A callback is a form, not fatigue. The house calls three of a kind a
        # repeat worth flagging; a running gag is four or five by design.
        repeat_run: 5
        # And a bit holds longer than 25s before it tires, because the timing
        # is the point and the payoff is at the end of it.
        fatigue_seconds: 40.0

    competitive:
      version: 1
      description: >-
        The play, clearly, with the context that makes it a play. Repetition is
        cheap here -- five clean kills of the same kind is what this audience
        came for -- and dead time is not.
      selection:
        entertainment: 1.20
        repetition_penalty: 0.50
        dead_time_penalty: 1.50
      shots:
        # The play, and the play only. Tight at both ends and cut on the
        # footage's own seams, because a competitive edit is watched for what
        # happened rather than for how it felt -- and a cut that lands
        # somewhere the picture already changed reads as a replay rather than
        # as an edit.
        trim_lead_in: 0.20
        trim_tail: 0.25
        snap_to_seams: true
        max_drift: 1.5
        dead_time_weight: 1.2
        # Open on the play and stop when it is decided. Nobody watching for
        # the result wants the walk to the lobby at either end.
        trim_weak_opening: true
        trim_weak_ending: true
        # And "decided" is now a measured instant rather than a figure of
        # speech: the shot ends shortly after the resolution the editorial
        # span located, on a seam the footage already has. Measured before
        # this line, shots here ran a median of 26 seconds past their own
        # resolution.
        trim_at_resolution: true
        # The call after the play is part of the play.
        hold_for_response: true
      pacing:
        # Slightly under the house. A competitive edit is watched to see what
        # happened, and a shot held past the moment it is understood is a shot
        # asking the viewer to admire it.
        band_scale: 0.90
        # And it lands on the beat harder than anything else here: the shot
        # after the kill starts when the kill lands, not a beat later.
        on_the_beat_seconds: 0.20
      audio:
        # Clarity over drama. The house holds a breath before a payoff; here
        # the payoff explains itself and a silence in front of it reads as the
        # edit telling the viewer what to feel about a scoreline.
        silence_before_payoff: 0.30
        silence_min_strength: 0.75
      captions:
        # **Clarity over decoration**, in the layer drawn on top of the play.
        #
        # The house fades every caption in over three frames and rises it a
        # sixth of its own height on entry. That motion sits directly over the
        # thing this audience is watching, and it moves at exactly the moment
        # something is happening -- because a caption arrives when somebody
        # speaks, and somebody speaks when the play is worth talking about.
        animated: false
        # And the lit word travels across the line as it is spoken. On a clutch
        # that is a second moving object over the one that matters. The line is
        # still there to be read; it simply stops performing.
        #
        # This is the same argument as `ideal_effects_per_minute: 1.5` below
        # and `effects_per_ten_seconds: 2.0` under critique, applied to the one
        # overlay that was exempt from it.
        word_highlighting: false
      judgement:
        # **Clarity over decoration**, as a number the judge reads. The house
        # expects three nameable beats a minute and marks an edit down for
        # having fewer; this style earns nothing by decorating and should not
        # be scored as though it did.
        ideal_effects_per_minute: 1.5
      critique:
        # Five clean kills of the same kind is what this audience came for.
        # The house flags three of a kind as a repeat; here repetition is the
        # subject, and the critic saying otherwise is the critic applying
        # somebody else's taste.
        repeat_run: 6
        # And decoration is capped rather than encouraged: half the house's
        # allowance, so a busy stretch is flagged sooner.
        effects_per_ten_seconds: 2.0

    minimal:
      version: 1
      description: >-
        No decoration at all, by its effects profile, and no editorial opinion
        either: the session in its own order, the strongest parts kept. The
        judge is told not to expect effects, or it would mark every minimal
        edit down for their absence.
      selection:
        # The one style that leans on nothing, and the doctrine has to say so
        # in numbers or it is a description rather than a decision. Strip every
        # trick and what is left is whether the thing follows: narrative up,
        # spectacle down -- a moment that needs decoration to land does not
        # land here -- and no hunting for variety, because a minimal edit is
        # not a survey.
        narrative: 1.35
        entertainment: 0.75
        variety: 0.70
      shots:
        # Nothing is added, so everything that stays has to earn it. This is
        # the style that prices editorial dead time hardest -- with no
        # decoration to carry a weak stretch, a weak stretch is just a weak
        # stretch. The edges are left alone: trimming would be an opinion, and
        # this style is the absence of one.
        dead_time_weight: 1.5
        # One exception to that, and it is §16 rather than a taste: a video
        # should end on something. Trailing off is not minimalism, it is
        # running out of footage with the camera still on.
        trim_weak_ending: true
      judgement:
        ideal_effects_per_minute: 0.0

    default:
      version: 1
      description: >-
        The house body, used by a project that named no style and by any name
        this file does not know. Overrides nothing, which is the claim that
        the machine's own constants are the channel's taste -- the same claim
        best_moments makes, and the reason the two are identical.
