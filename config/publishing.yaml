# Delivery configuration.
#
# The MVP exports to a local file and nothing else. This section exists so that
# adding a destination later is a configuration + one class, not a pipeline
# change.
#
# Two rules hold for any destination that is ever added:
#   * Publishing is always an explicit user action. Nothing uploads on its own,
#     and no analysis or telemetry containing footage leaves the machine (§51).
#   * Credentials never live in this file. A publisher resolves them from the
#     OS credential store at call time.

publishing:
  enabled: true

  # Targets the running build will accept. A target listed here still needs a
  # registered publisher; one without an implementation fails with
  # PUBLISH_TARGET_NOT_CONFIGURED rather than doing nothing quietly.
  # Hands-free uploads only above this doctrine score (0-100). A green QA
  # with warnings can still be a bad video; the button ignores this floor,
  # the auto path respects it.
  auto_publish_minimum_score: 60

  enabled_targets:
    - local_file
    - youtube

  default_target: local_file

  # Applied to every publication before it is sent.
  defaults:
    visibility: private
    made_for_kids: false
    category: null
    # Chapters are generated from the story sections during narrative
    # construction and are useful locally regardless of destination.
    generate_chapters: true
    min_chapter_seconds: 30
    # Burn a hook phrase onto the suggested thumbnail, in the transcript's
    # language, at the peak frame -- a bare screenshot spends the click.
    thumbnail_hook: true
    # Every generated title, description and tag list is written in this
    # language ("ar", "en", or "auto" to follow the transcript).
    title_language: ar
    # The local model writes each video's own title and thumbnail hook from
    # its evidence; the deterministic templates remain the fallback.
    creative_text: true
    # Recompose the thumbnail around the subject the vision model locates.
    thumbnail_composition: true

  local_file:
    # null -> the project's renders/ directory is offered as the default.
    default_directory: null
    overwrite: false

  # Planned, not implemented. Present so the shape of the eventual settings is
  # already fixed and the UI has something to bind to.
  youtube:
    enabled: true
    # The OAuth *client* pair is yours, created once at
    # console.cloud.google.com (an "installed app" client with the YouTube
    # Data API enabled). The id is public by design and may live here; the
    # secret goes in its own file so this file never carries one. The granted
    # token is written to token_file under the data root, owner-only.
    client_id: 583344787316-pm8rf3ftbtiep687fkjl5hm2rf0bdval.apps.googleusercontent.com
    client_secret_file: .credentials/google_client_secret.txt
    token_file: .credentials/youtube_oauth.json
    default_playlist: null
    default_visibility: public
    # An upload is never started without the user confirming it.
    require_explicit_confirmation: true
    upload_chunk_bytes: 8388608
    max_retries: 5
