# Effects engine (SPEC §68, §69, §70).
#
# Effects are declarative data. The planner decides *which* effect goes *where*
# from the moments and events already detected; the renderer decides how to
# realise it. Nothing here calls a renderer, and no effect is ever applied
# globally (§69).
#
# Every entry declares:
#   engine    which renderer realises it -- ffmpeg alters the gameplay footage,
#             remotion draws on a transparent overlay composited on top
#   category  how it reads on screen, so a single moment does not collect three
#             effects of the same character
#   triggers  what makes it appropriate: moment types, game events, and the
#             minimum score a moment needs before it earns decoration
#   limits    rate limits. An effect that fires constantly stops being an effect
#   params    defaults, all overridable per instance on the timeline

effects:
  enabled: true

  # Which renderer wires are live. The planner stored seventeen effects across
  # three real projects before either wire existed, and not one reached the
  # finished video. One switch per engine, so a misbehaving realiser can be
  # turned off without silencing the planner or the other engine.
  realisation:
    # ffmpeg_filters also governs the time-warps (freeze_frame, speed_ramp):
    # with it off the EDL never re-lays clip durations for them, so the rows
    # stay stored-but-unrealised instead of promising seconds nothing renders.
    ffmpeg_filters: true    # bake zoom/punch_in/bars/flash/shake/freeze/ramp into segments
    remotion_overlay: true  # pass remotion-engine effects to the overlay

  # Rank a moment against this video's own scores before testing a trigger's
  # min_score. Without a game profile, a microphone or detected reactions the
  # whole distribution shifts down -- a real session's best moment scored 0.53
  # against a lowest threshold of 0.55, and every effect went silent on the
  # footage §23 promises to support.
  relative_thresholds: true
  # Ranking never rescues a video where nothing happened.
  absolute_floor: 0.2

  # Global dial, scaled by the editing intent: none -> 0.0, minimal -> 0.3,
  # moderate -> 0.6, heavy -> 1.0. Multiplies every effect's strength and its
  # per-minute budget.
  intensity: 0.6

  # Applies to the whole video regardless of individual limits, so a long video
  # cannot accumulate an exhausting number of effects.
  global_limits:
    max_effects_per_minute: 6
    max_effects_per_moment: 3
    min_gap_seconds: 1.5
    # Two effects of the same category back to back read as one long gimmick.
    max_consecutive_same_category: 1

  library:
    # -- camera ----------------------------------------------------------
    zoom:
      enabled: true
      engine: ffmpeg
      category: camera
      description: "Gradual push toward the action."
      params:
        scale: 1.12
        max_scale: 1.35
        duration_seconds: 2.0
        easing: ease_in_out
        anchor: auto          # auto | center | crosshair | subject
      triggers:
        moment_types: [clutch, skill, outplay, epic, tension]
        events: [kill, multi_kill, clutch, high_damage]
        min_score: 0.55
      limits:
        max_per_minute: 3
        max_per_video: 40
        min_gap_seconds: 6.0

    punch_in:
      enabled: true
      engine: ffmpeg
      category: camera
      description: "Instant cut to a tighter framing on the beat of an event."
      params:
        scale: 1.2
        hold_seconds: 1.2
        anchor: auto
      triggers:
        moment_types: [epic, clutch, surprise, outplay]
        events: [multi_kill, clutch, boss_defeat]
        min_score: 0.7
      limits:
        max_per_minute: 2
        max_per_video: 20
        min_gap_seconds: 10.0
        cooldown_seconds: 8.0
      # Doctrine §9: a run of punches escalates instead of repeating -- the
      # first firing of a run stays quiet, the fourth lands at full strength.
      escalation: [0.0, 0.5, 0.75, 1.0]

    camera_shake:
      enabled: true
      engine: ffmpeg
      category: camera
      description: "Short handheld jolt on impact."
      params:
        amplitude_px: 8
        frequency_hz: 14.0
        duration_seconds: 0.5
        decay: 0.7
      triggers:
        moment_types: [chaos, epic, fail, rage]
        events: [high_damage, near_death, death, boss_fight]
        min_score: 0.5
      limits:
        max_per_minute: 2
        max_per_video: 24
        min_gap_seconds: 8.0
        cooldown_seconds: 8.0
      escalation: [0.0, 0.5, 0.75, 1.0]

    crop:
      enabled: false
      engine: ffmpeg
      category: camera
      description: "Reframe to a region of interest. Off by default: it discards picture."
      params:
        region: auto
      triggers:
        moment_types: []
        events: []
        min_score: 0.9
      limits:
        max_per_minute: 1
        max_per_video: 6
        min_gap_seconds: 30.0

    # -- time ------------------------------------------------------------
    # Time effects change how long a clip takes, so the EDL re-lays clip
    # durations for them (backend/timeline/retime.py) before anything is cut.
    slow_motion:
      # Off until a renderer realises it: it warps a *whole* clip rather than
      # a window inside one, which the re-lay does not express. Enabled, it
      # sat first in the library and won the one-time-effect-per-moment slot
      # from the two warps that do render -- a stored row nobody would ever
      # see, crowding out a freeze the viewer would.
      enabled: false
      engine: ffmpeg
      category: time
      description: "Sustained slow section over a decisive beat."
      params:
        rate: 0.5
        min_rate: 0.35
        duration_seconds: 1.5
        # Audio is pitch-corrected rather than dropped, so speech stays legible.
        audio_mode: pitch_corrected
      triggers:
        moment_types: [epic, clutch, skill, outplay, boss]
        events: [multi_kill, clutch, boss_defeat, outplay]
        min_score: 0.72
      limits:
        max_per_minute: 1
        max_per_video: 10
        min_gap_seconds: 20.0

    speed_ramp:
      enabled: true
      engine: ffmpeg
      category: time
      description: "Slow to a crawl over the beat, back to speed after (§69)."
      params:
        # The doctrine's shape: 1.0 into the anchor, slow_factor across the
        # window (duration_seconds of *source*, the doctrine's slow_seconds),
        # 1.0 after. The clip gains duration_seconds * (1/slow_factor - 1)
        # on the timeline, which the EDL re-lay accounts for.
        slow_factor: 0.4
        duration_seconds: 0.8
      triggers:
        # High-importance impact events only: a ramp on an ordinary kill
        # teaches the viewer to ignore ramps.
        moment_types: [epic, clutch]
        events: [multi_kill, clutch, boss_defeat]
        min_score: 0.8
      limits:
        max_per_minute: 1
        max_per_video: 4
        min_gap_seconds: 25.0
        cooldown_seconds: 20.0

    freeze_frame:
      enabled: true
      engine: ffmpeg
      category: time
      description: "Hold on the decisive frame, often with a caption."
      params:
        duration_seconds: 0.8
        # Must stay under qa.technical.thresholds.max_frozen_run_seconds
        # (3.0): §76's frozen-frames check treats any longer still run as a
        # broken render and asks the recording, which was moving.
        max_duration_seconds: 1.5
        # Silence under the hold: a freeze with looping audio is worse than
        # quiet, and stingers are a later layer (§72).
        hold_audio: false
      triggers:
        # The single strongest moment shapes only, at a threshold the ranked
        # scores reserve for the top of a video: one or two per edit.
        moment_types: [clutch, epic]
        events: []
        min_score: 0.85
      limits:
        max_per_minute: 1
        max_per_video: 2
        min_gap_seconds: 30.0
        cooldown_seconds: 30.0

    # -- light and focus --------------------------------------------------
    flash:
      enabled: true
      engine: ffmpeg
      category: light
      description: "Brief white flash on a hard cut."
      params:
        duration_seconds: 0.12
        peak_opacity: 0.55
        color: "#FFFFFF"
      triggers:
        moment_types: [epic, chaos, surprise]
        events: [multi_kill, boss_defeat]
        min_score: 0.7
      limits:
        max_per_minute: 2
        max_per_video: 16
        min_gap_seconds: 12.0
        cooldown_seconds: 8.0
      escalation: [0.0, 0.5, 0.75, 1.0]

    blur:
      enabled: true
      engine: ffmpeg
      category: light
      description: "Defocus the background to isolate the subject."
      params:
        strength: 0.4
        duration_seconds: 1.0
        mode: background      # background | full | radial
      triggers:
        moment_types: [tension, discovery, rare]
        events: [rare_loot, objective]
        min_score: 0.6
      limits:
        max_per_minute: 1
        max_per_video: 12
        min_gap_seconds: 20.0

    glow:
      enabled: true
      engine: ffmpeg
      category: light
      description: "Lift highlights for a moment of triumph."
      params:
        strength: 0.35
        duration_seconds: 1.2
      triggers:
        moment_types: [victory, epic, rare]
        events: [victory, rare_loot, boss_defeat]
        min_score: 0.7
      limits:
        max_per_minute: 1
        max_per_video: 10
        min_gap_seconds: 25.0

    motion_blur:
      enabled: true
      engine: ffmpeg
      category: light
      description: "Directional smear across a fast movement or speed change."
      params:
        strength: 0.3
        duration_seconds: 0.4
      triggers:
        moment_types: [chaos, skill, epic]
        events: [chase, escape]
        min_score: 0.6
      limits:
        max_per_minute: 2
        max_per_video: 18
        min_gap_seconds: 10.0

    # -- graphics ---------------------------------------------------------
    highlight_box:
      enabled: true
      engine: remotion
      category: graphic
      description: "Marker drawn around the enemy, item or objective that matters."
      params:
        style: corner_brackets   # corner_brackets | solid | dashed
        color: "#FFD400"
        thickness: 3
        duration_seconds: 1.4
        # Only drawn when a detector supplied a region; never guessed.
        require_detected_region: true
      triggers:
        moment_types: [skill, outplay, discovery, rare]
        events: [rare_loot, objective, kill]
        min_score: 0.65
      limits:
        max_per_minute: 2
        max_per_video: 20
        min_gap_seconds: 8.0

    crosshair:
      enabled: false
      engine: remotion
      category: graphic
      description: "Emphasise the aim point during a precise shot."
      params:
        style: ring
        color: "#FF4D4D"
        duration_seconds: 0.8
        require_detected_region: true
      triggers:
        moment_types: [skill, outplay]
        events: [kill, multi_kill]
        min_score: 0.75
      limits:
        max_per_minute: 1
        max_per_video: 10
        min_gap_seconds: 15.0

    impact:
      enabled: true
      engine: remotion
      category: graphic
      description: "Burst graphic on the frame of a hit or elimination."
      params:
        style: burst           # burst | shockwave | sparks
        color: "#FFFFFF"
        duration_seconds: 0.35
        scale: 1.0
      triggers:
        moment_types: [epic, chaos, clutch]
        events: [kill, multi_kill, high_damage, boss_defeat]
        min_score: 0.6
      limits:
        max_per_minute: 3
        max_per_video: 30
        min_gap_seconds: 5.0

    kill_counter:
      enabled: true
      engine: remotion
      category: graphic
      description: "Running tally during a multi-kill streak."
      params:
        position: top_right
        style: stacked
        duration_seconds: 2.5
        # Only shown when the event stream actually carries a count.
        require_event_count: true
      triggers:
        moment_types: [epic, clutch]
        events: [multi_kill, kill]
        min_score: 0.65
      limits:
        max_per_minute: 2
        max_per_video: 15
        min_gap_seconds: 10.0

    meme:
      enabled: false
      engine: remotion
      category: graphic
      description: "Comedy overlay. Off by default: it dates fast and misfires easily."
      params:
        asset: null            # user-supplied, from the project's assets/
        duration_seconds: 1.5
        position: center
      triggers:
        moment_types: [funny, fail, rage]
        events: [fail, funny_moment]
        min_score: 0.8
      limits:
        max_per_minute: 1
        max_per_video: 5
        min_gap_seconds: 45.0

    # -- text --------------------------------------------------------------
    text_pop:
      enabled: true
      engine: remotion
      category: text
      description: "Short animated label naming what just happened."
      params:
        animation: pop_scale
        duration_seconds: 1.2
        max_characters: 24
        position: lower_third
        # Text is drawn from detected event labels, never invented.
        source: event_label
      triggers:
        moment_types: [epic, clutch, victory, fail, rare]
        events: [multi_kill, clutch, victory, defeat, rare_loot]
        min_score: 0.65
      limits:
        max_per_minute: 2
        max_per_video: 24
        min_gap_seconds: 8.0

    dynamic_captions:
      enabled: true
      engine: remotion
      category: text
      description: "Word-synchronised captions from the transcript."
      params:
        style: animated
        word_highlighting: true
        # Density is governed by config/captions.yaml; this only decides where
        # captions are worth showing at all.
        follow_caption_policy: true
      triggers:
        moment_types: []
        events: []
        min_score: 0.0
      limits:
        max_per_minute: 60
        max_per_video: 5000
        min_gap_seconds: 0.0

    # -- structural --------------------------------------------------------
    transition:
      enabled: true
      engine: ffmpeg
      category: transition
      description: "Between clips. A straight cut is the default and always will be."
      params:
        style: cut             # cut | fade | crossfade | dip_to_black | whip
        duration_seconds: 0.3
      triggers:
        moment_types: []
        events: []
        min_score: 0.0
      limits:
        max_per_minute: 30
        max_per_video: 500
        min_gap_seconds: 0.0

    fade:
      enabled: true
      engine: ffmpeg
      category: transition
      description: "Programme open and close."
      params:
        in_seconds: 0.5
        out_seconds: 0.8
      triggers:
        moment_types: []
        events: []
        min_score: 0.0
      limits:
        max_per_minute: 2
        max_per_video: 4
        min_gap_seconds: 0.0

    cinematic_bars:
      enabled: true
      engine: ffmpeg
      category: frame
      description: "Letterbox for a deliberately cinematic beat."
      params:
        ratio: 2.39
        fade_seconds: 0.4
        duration_seconds: 4.0
      triggers:
        moment_types: [epic, tension, boss, victory]
        events: [boss_fight, boss_defeat, victory]
        min_score: 0.75
      limits:
        max_per_minute: 1
        max_per_video: 6
        min_gap_seconds: 60.0

    # -- audio -------------------------------------------------------------
    sound_effect:
      enabled: true
      engine: ffmpeg
      category: audio
      description: "Stinger on a beat, voiced by what happened (§14). Synthesised locally; nothing is downloaded."
      params:
        # No single default: the voice comes from the mapping below, chosen
        # by the moment's matched events first, then its type. Values are
        # parameter overrides; assets resolve from the project's assets/sfx
        # first, then the synthesised set (backend/rendering/sfx.py).
        asset: null
        gain_db: -6.0
        duration_seconds: 1.0
        # Ducks the music but never the player's voice (§72 priority order).
        duck_music: true
        voices:
          # events -- more specific than the moment's type, consulted first
          multi_kill: {asset: hit.wav, gain_db: -8.0, duration_seconds: 0.4}
          clutch: {asset: hit.wav, gain_db: -8.0, duration_seconds: 0.4}
          victory: {asset: hit.wav, gain_db: -8.0, duration_seconds: 0.4}
          defeat: {asset: whoosh.wav, gain_db: -10.0, duration_seconds: 1.1}
          # moment types
          epic: {asset: impact.wav, gain_db: -6.0, duration_seconds: 0.9}
          chaos: {asset: impact.wav, gain_db: -6.0, duration_seconds: 0.9}
          fail: {asset: whoosh.wav, gain_db: -10.0, duration_seconds: 1.1}
          funny: {asset: whoosh.wav, gain_db: -10.0, duration_seconds: 1.1}
          # A riser belongs before its peak: lead_seconds slides it back so
          # the climb lands on the moment, not after it (§14).
          boss: {asset: riser.wav, gain_db: -12.0, duration_seconds: 2.0, lead_seconds: 2.0}
      triggers:
        moment_types: [epic, clutch, funny, fail, victory, chaos, boss]
        events: [multi_kill, clutch, victory, defeat]
        min_score: 0.7
      limits:
        max_per_minute: 2
        max_per_video: 20
        min_gap_seconds: 10.0

  # Per-style overrides. A preset scales the whole library rather than
  # re-declaring it, so adding an effect needs no preset edits (§75).
  style_profiles:
    gaming_fast:
      intensity: 1.0
      boost: [punch_in, impact, speed_ramp, flash, camera_shake]
      suppress: [cinematic_bars]
    cinematic:
      intensity: 0.35
      boost: [cinematic_bars, slow_motion, glow, blur]
      suppress: [impact, meme, kill_counter, flash, camera_shake]
    funny:
      intensity: 0.8
      boost: [freeze_frame, text_pop, meme, punch_in]
      suppress: [cinematic_bars]
    competitive:
      intensity: 0.3
      boost: [highlight_box, kill_counter, slow_motion]
      suppress: [meme, flash, camera_shake, cinematic_bars]
    story:
      intensity: 0.45
      boost: [cinematic_bars, slow_motion, text_pop]
      suppress: [meme, impact]
    minimal:
      intensity: 0.0
      boost: []
      suppress: []
    best_moments:
      intensity: 0.6
      boost: [zoom, impact, text_pop]
      suppress: [meme]
    default:
      intensity: 0.6
      boost: []
      suppress: []
