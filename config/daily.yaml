# The owner's DAILY VIDEO PRODUCTION & PUBLISHING POLICY (2026-08-29),
# standing. Production fires at 02:00 Europe/Oslo, publication lands at
# 10:00 Europe/Oslo (scheduled on YouTube itself, so the video goes public
# at that instant and never before), and the day never exceeds one long
# video and two Reels. Times follow Norway's clock, summer and winter --
# the zoneinfo database owns the DST arithmetic, never a fixed UTC offset.

daily:
  enabled: true
  timezone: Europe/Oslo
  production_time: "02:00"
  publish_time: "10:00"
  max_long_videos: 1
  max_reels: 2
  # The Reels publish too (owner, 2026-08-29): uploaded with the night's
  # batch, public at these Oslo times -- the day spread out, not crowded.
  reel_publish_times: ["13:00", "17:00"]
  # Where each finished video is copied (owner named it, 2026-08-29).
  # Excluded from discovery like the done-shelf: output is never input.
  output_directory: "D:/Gaming 2026/Output"
  # The done-shelf (owner, 2026-08-29): every recording whose video is
  # produced and on YouTube moves here -- created if missing, excluded
  # from discovery, ledger and media rows following the file. Moving is
  # not deleting: the original survives, relocated.
  archive_directory: "D:/Gaming 2026/Ferdig"

  # Which eligible recording a day picks: the newest session first --
  # fresh content for a daily channel -- with the backlog kept for the
  # days that follow, exactly as the policy orders.
  selection: newest
